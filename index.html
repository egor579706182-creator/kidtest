    <title>CommuniScale Pro | Диагностическая система</title>
    <!-- Глобальный фикс для process.env до загрузки любых модулей -->
    <script>
      (function() {
        window.process = window.process || {};
        window.process.env = window.process.env || {};
        // Если API_KEY не задан напрямую, пробуем подтянуть его из других возможных мест
        if (!window.process.env.API_KEY) {
          window.process.env.API_KEY = ""; 
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

      body { 
        margin: 0; 
        padding: 0;

      }
      .font-serif { font-family: 'Lora', serif; }

          margin: 15mm;

        #root { padding: 0 !important; margin: 0 !important; }
        .min-h-screen { min-height: auto !important; display: block !important; padding: 0 !important; }

        .printable-area { width: 100% !important; margin: 0 !important; border: none !important; }
        .bg-slate-50 { background: white !important; }
        .shadow-2xl, .shadow-xl, .shadow-sm { box-shadow: none !important; }
        .border, .border-2 { border-color: #f1f5f9 !important; }
        .text-indigo-900 { color: #1e1b4b !important; border-bottom: 1px solid #e2e8f0 !important; }
        .clinical-text { font-size: 11pt !important; line-height: 1.6 !important; color: black !important; }
      }
    </style>
